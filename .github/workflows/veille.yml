name: Veille Technologique

on:
  schedule:
    # GitHub Actions ne connaît que l'UTC — deux crons pour viser 10h Paris été
    # comme hiver. Le job check-time détermine lequel des deux correspond à
    # l'heure réelle et annule l'autre (voir job veille, condition needs).
    - cron: '0 8 * * 1-5'  # 10h Paris en été (UTC+2)
    - cron: '0 9 * * 1-5'  # 10h Paris en hiver (UTC+1)
  workflow_dispatch:          # déclenchement manuel depuis GitHub — toujours exécuté

jobs:
  check-time:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Vérifier qu'il est bien 10h à Paris (ignoré si déclenchement manuel)
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=Europe/Paris date +%H)
          if [ "$HOUR" = "10" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Il est ${HOUR}h à Paris, pas 10h — ce cron correspond à l'autre saison (heure d'été/hiver), on annule."
          fi

  veille:
    needs: check-time
    if: needs.check-time.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Clé de semaine ISO
        run: echo "WEEK_KEY=$(date +%Y-W%V)" >> $GITHUB_ENV

      - name: Restaurer les digests de la semaine (recap vendredi)
        uses: actions/cache@v4
        with:
          path: output/
          key: output-${{ env.WEEK_KEY }}-${{ github.run_number }}
          restore-keys: |
            output-${{ env.WEEK_KEY }}-

      - name: Lancer la veille quotidienne
        run: npx tsx src/run-once.ts --mode=daily
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ secrets.OPENROUTER_MODELS }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ secrets.WIKI_USERNAME }}
          GITHUB_REPO: ${{ secrets.WIKI_REPO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Déterminer si récap hebdo (vendredi)
        id: day
        run: echo "is_friday=$([ "$(date +%u)" = "5" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Lancer le récap hebdo (vendredi uniquement)
        if: steps.day.outputs.is_friday == 'true'
        run: npx tsx src/run-once.ts --mode=weekly
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ secrets.OPENROUTER_MODELS }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ secrets.WIKI_USERNAME }}
          GITHUB_REPO: ${{ secrets.WIKI_REPO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
