name: Veille Technologique

on:
  # Pas de cron natif GitHub Actions ici — le déclenchement schedule est
  # best-effort côté GitHub (délai de quelques minutes à plusieurs heures
  # possible, événement parfois perdu en cas de forte charge). Le run
  # automatique quotidien (10h Paris, été comme hiver) est déclenché par un
  # service externe (cron-job.org) qui appelle l'API workflow_dispatch —
  # voir ETAT-PROJET.md pour la configuration exacte.
  workflow_dispatch:          # déclenchement manuel (bouton GitHub, ou API externe)
    inputs:
      mode:
        description: >-
          auto (bouton GitHub — quotidien, + hebdo si vendredi) ; daily ou
          weekly pour un déclenchement externe explicite (cron-job.org)
        type: choice
        options: [auto, daily, weekly]
        default: auto

jobs:
  veille:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Clé de semaine ISO
        run: echo "WEEK_KEY=$(date +%Y-W%V)" >> $GITHUB_ENV

      - name: Restaurer les digests de la semaine (recap vendredi)
        uses: actions/cache@v4
        with:
          path: output/
          key: output-${{ env.WEEK_KEY }}-${{ github.run_number }}
          restore-keys: |
            output-${{ env.WEEK_KEY }}-

      - name: Déterminer les modes à exécuter
        id: modes
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          IS_FRIDAY=$([ "$(date +%u)" = "5" ] && echo true || echo false)
          if [ "$MODE" = "daily" ]; then
            echo "run_daily=true" >> "$GITHUB_OUTPUT"
            echo "run_weekly=false" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "weekly" ]; then
            echo "run_daily=false" >> "$GITHUB_OUTPUT"
            echo "run_weekly=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_daily=true" >> "$GITHUB_OUTPUT"
            echo "run_weekly=$IS_FRIDAY" >> "$GITHUB_OUTPUT"
          fi

      - name: Lancer la veille quotidienne
        if: steps.modes.outputs.run_daily == 'true'
        run: npx tsx src/run-once.ts --mode=daily
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ secrets.OPENROUTER_MODELS }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ secrets.WIKI_USERNAME }}
          GITHUB_REPO: ${{ secrets.WIKI_REPO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Lancer le récap hebdo
        if: steps.modes.outputs.run_weekly == 'true'
        run: npx tsx src/run-once.ts --mode=weekly
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ secrets.OPENROUTER_MODELS }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ secrets.WIKI_USERNAME }}
          GITHUB_REPO: ${{ secrets.WIKI_REPO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
